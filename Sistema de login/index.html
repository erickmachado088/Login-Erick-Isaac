<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagina Inicial</title>
    <link rel="stylesheet" href="style.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    <div class="cadastro">
        <form id="loginForm">
            <h1>Login</h1>
            <div class="input-box">
                <input type="email" id="loginEmail" placeholder="Digite seu email" required>
                <i class='bx bxs-user'></i>
            </div>
            <div class="input-box">
                <input type="password" id="loginPassword" placeholder="Senha" required>
                <i class='bx bxs-lock-alt'></i>
            </div>
            <div class="remember-forgot">
                <label> <input type="checkbox"> Salvar</label>
                <a href="senha.html">Esqueci minha senha</a>
            </div>
            <button class="btn" type="submit">Login</button>
            <div class="register-link">
                <p>Não tem uma conta? <a href="cadastro.html">Registre-se</a></p>
            </div>
        </form>
    </div>

    <script src="app.js"></script>
</body>
</html>
